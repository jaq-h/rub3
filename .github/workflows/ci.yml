name: CI

# Runners are macOS because any build with the `webview` feature links `wry` +
# `tao`, and the default feature set enables it, so the lint job compiles them.
# On Linux those need webkit2gtk/GTK system packages installed via apt, and this
# workflow was verified end to end on macOS only -- no step here is guessed.
# The tier and headless bundles below build with --no-default-features and link
# neither, so they could move to ubuntu-latest once that is verified.

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Rust wrapper, one job per tier bundle.
  #
  # WHY --no-default-features IS NON-NEGOTIABLE:
  #   Cargo features are additive. The crate sets
  #   `default = ["tier-2", "webview"]`, so `--features tier-0` means tier-2 plus
  #   the webview front door PLUS tier-0, not tier-0. Measured on this branch:
  #   `cargo tree --features tier-0` still lists `rand` (the dependency that only
  #   the `session` feature pulls in), and `cargo test -p rub3-wrapper --features
  #   tier-0 --lib` runs 62 tests, exactly the default count, instead of tier-0's
  #   32. Without `--no-default-features` this matrix would test the default
  #   bundle every time and look like coverage while proving nothing.
  # ---------------------------------------------------------------------------
  rust:
    name: rust (${{ matrix.bundle }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - bundle: tier-0
            features: tier-0
          - bundle: tier-1
            features: tier-1
          - bundle: tier-2
            features: tier-2
          - bundle: tier-3
            features: tier-3
          - bundle: tier-4
            features: tier-4
          - bundle: tier-3 + headless
            features: tier-3,headless
          # The interactive front door. Tier bundles no longer imply it, so
          # without this entry nothing blocking compiles src/webview.rs.
          - bundle: tier-2 + webview
            features: tier-2,webview

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Show toolchain
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          # Feature sets produce different artifacts; keep a cache per bundle
          # so the matrix jobs do not evict each other.
          key: ${{ matrix.bundle }}

      - name: Build (${{ matrix.bundle }})
        run: cargo build -p rub3-wrapper --no-default-features --features ${{ matrix.features }} --all-targets

      - name: Test (${{ matrix.bundle }})
        run: cargo test -p rub3-wrapper --no-default-features --features ${{ matrix.features }}

  # ---------------------------------------------------------------------------
  # Formatting and lint. Clippy is now a REAL GATE; fmt is still advisory.
  #
  # Measured on this branch at the commit that made clippy clean:
  #
  #   cargo clippy -p rub3-wrapper                exit 0, no warnings, under the
  #     --all-targets -- -D warnings              default bundle and under
  #                                               tier-0/1/2/3/4,
  #                                               tier-3,binary-encryption,
  #                                               tier-2,webview and
  #                                               tier-3,headless.
  #                                               The 6 warnings main carried are
  #                                               fixed at the root: the
  #                                               conditionally-dead IpcState TTL
  #                                               field, map_or -> is_some_and,
  #                                               deref_addrof and the function
  #                                               item cast in supervisor's
  #                                               signal trampoline, the shared
  #                                               tests/helpers module that each
  #                                               test binary only partly uses,
  #                                               and the ten-field session
  #                                               preimage builder (allowed with
  #                                               a stated reason - one parameter
  #                                               per hashed field is the point).
  #
  #   cargo fmt --all -- --check                  exit 1, 11 diff hunks in a
  #                                               single file:
  #                                               tests/session_onchain_e2e.rs
  #                                               (hand-aligned argument lists
  #                                               rustfmt wants to explode one
  #                                               per line). Every other file in
  #                                               the workspace is rustfmt-clean.
  #
  # That last file is owned by the concurrent section-2.4 branch, which is
  # rewriting its constructor-argument list - exactly the region rustfmt would
  # reflow. Formatting it here would hand that branch a pointless conflict, so
  # the fmt step stays `continue-on-error` until 2.4 lands and its owner runs
  # rustfmt over it. At that point drop the `continue-on-error` below and fmt
  # becomes a real gate too.
  #
  # The fmt failure is scoped to the STEP, not the job, so clippy regressions now
  # turn this check red. clippy runs with `-D warnings` on purpose: plain
  # `cargo clippy` exits 0 even when it emits warnings, so a permissive clippy
  # job would sit green forever and prove nothing.
  # ---------------------------------------------------------------------------
  lint:
    name: lint (clippy blocking, fmt advisory)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: lint

      # Advisory: one pre-existing file is deliberately left unformatted, see
      # above. The log still shows the drift.
      - name: cargo fmt --check (advisory)
        continue-on-error: true
        run: cargo fmt --all -- --check

      # always() so the advisory fmt step never short-circuits the real gate.
      - name: cargo clippy
        if: always()
        run: cargo clippy -p rub3-wrapper --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Solidity. `forge test` MUST run from contracts/ -- remappings.txt uses paths
  # relative to that directory, so at the repo root it fails to resolve
  # forge-std/Test.sol. OpenZeppelin and forge-std are git submodules, hence
  # submodules: recursive.
  # ---------------------------------------------------------------------------
  contracts:
    name: contracts (forge test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1.9.1

      - name: forge test
        working-directory: contracts
        run: forge test -vv

  # ---------------------------------------------------------------------------
  # Canonical bytecode fingerprints. BLOCKING, not advisory.
  #
  # The canonical fingerprint of a rub3 contract is sha256 of the compiler's
  # `deployedBytecode.object` - the runtime code with immutable slots zeroed, so
  # it depends on the contract's compiled semantics and not on the constructor
  # arguments a given deploy chose. A buyer's agent will later compare an
  # on-chain contract against exactly this number, so it must never move without
  # somebody noticing.
  #
  # It is NOT sha256(eth_getCode(addr)). A live deploy returns those slots filled
  # with its constructor's values, so a comparator MUST first zero every range
  # published as `immutable_ranges` in contracts/canonical-bytecode.json before
  # hashing; without that step the comparison fails on every real deploy. This
  # job publishes and pins those ranges. It implements no comparison, and neither
  # does the wrapper yet - see contracts/contracts.md -> "Read this first".
  #
  # contracts/foundry.toml sets bytecode_hash = "none" to make that possible.
  # Measured on this branch, with the default ("ipfs") and without it:
  #
  #   adding one comment line to Rub3License.sol   ipfs: e5590970... (moved)
  #                                                none: 57ef9e36... (unchanged)
  #   renaming contracts/src -> contracts_src      ipfs: 60c76f0f... (moved)
  #                                                none: 57ef9e36... (unchanged)
  #
  # The script self-checks that setting and fails loudly if it is ever reverted.
  # It discovers the deployable contracts from the artifacts of the build it
  # just ran, keeping the ones whose compilationTarget sits under contracts/src,
  # so a contract added on another branch is fingerprinted here without anybody
  # editing the script.
  # When the contracts legitimately change, this job stays red until the
  # regenerated contracts/canonical-bytecode.json is committed in the same pull
  # request. That is the intended workflow, not a nuisance.
  #
  # WHY THIS ONE JOB PINS forge AND ITS SIBLINGS DO NOT
  # The other foundry jobs here care only about what forge *compiles*, and
  # foundry.toml pins solc_version, so any forge builds the same bytecode. This
  # job also cares about what forge *emits*: the manifest records solc's own
  # settings object as forge assembled it, and the check diffs the whole
  # manifest. A forge release that starts passing an extra standard-json setting
  # to the pinned solc, or stops passing one, would therefore turn this blocking
  # job red on an unrelated pull request with no repo change and byte-identical
  # fingerprints. A blocking check people learn to ignore is worse than no
  # check, so this job alone pins the version. Leave the sibling jobs unpinned.
  #
  # HOW TO BUMP THE PIN
  # Deliberately, and never on its own: raise the `version:` below, run
  #
  #     scripts/canonical-bytecode-hashes.sh update
  #
  # and commit the regenerated contracts/canonical-bytecode.json in the SAME
  # pull request, so the recorded build inputs and the forge that produced them
  # move together. This is the same workflow the index-based lock/gitlink
  # cross-check already supports for a dependency bump. The fingerprints
  # themselves should not move across a forge bump; if one does, the contracts
  # or the pinned solc changed too, and that is worth understanding first.
  # ---------------------------------------------------------------------------
  bytecode-fingerprints:
    name: canonical bytecode fingerprints (blocking)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      # Pinned on purpose; see HOW TO BUMP THE PIN above. This is the forge that
      # produced the checked-in contracts/canonical-bytecode.json.
      - uses: foundry-rs/foundry-toolchain@v1.9.1
        with:
          version: v1.5.1

      # foundry.toml pins solc_version, so forge fetches that exact compiler
      # regardless of its own version; solc is the load-bearing pin for the
      # fingerprints, and the forge pin above is for the recorded settings.
      - name: Show toolchain
        run: forge --version

      - name: Check canonical fingerprints
        run: scripts/canonical-bytecode-hashes.sh check

  # ---------------------------------------------------------------------------
  # Anvil-gated on-chain E2E, both #[ignore]d suites.
  # session_onchain_e2e.rs spawns a local anvil, deploys Rub3Access with
  # `forge create` from contracts/, runs purchase + activate, then asserts
  # verify_onchain accepts the good session and rejects three tampered ones.
  # headless_e2e.rs drives the agent front door end to end on a fresh key.
  # Both need submodules (forge create compiles the contracts) and Foundry.
  #
  # headless_e2e runs unfiltered and without --test-threads=1: the suite
  # serialises itself in-file around the anvil port and the env vars it sets.
  #
  # Kept in its own job rather than folded into the tier-3 matrix job so that an
  # on-chain failure is distinguishable at a glance from a unit-test failure.
  # ---------------------------------------------------------------------------
  onchain-e2e:
    name: on-chain e2e (tier-3 + anvil)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1.9.1

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: onchain-e2e

      # The test self-skips with a SKIP: message and still exits 0 when anvil,
      # forge or cast are missing. Without this guard a broken Foundry install
      # would turn the whole job into a silent no-op that reports green.
      - name: Require Foundry on PATH
        run: |
          for bin in anvil forge cast; do
            command -v "$bin" >/dev/null 2>&1 || { echo "::error::$bin not found on PATH"; exit 1; }
          done

      - name: session_verify_onchain_e2e
        run: |
          cargo test -p rub3-wrapper --no-default-features --features tier-3 \
            --test session_onchain_e2e -- --ignored --nocapture

      # always() so a failure in the sibling suite does not hide this one.
      - name: headless_e2e
        if: always()
        run: |
          cargo test -p rub3-wrapper --no-default-features --features tier-3,headless \
            --test headless_e2e -- --ignored --nocapture
