name: CI

# Runners are macOS because any build with the `webview` feature links `wry` +
# `tao`, and the default feature set enables it, so the lint job compiles them.
# On Linux those need webkit2gtk/GTK system packages installed via apt, and this
# workflow was verified end to end on macOS only -- no step here is guessed.
# The tier and headless bundles below build with --no-default-features and link
# neither, so they could move to ubuntu-latest once that is verified.

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Rust wrapper, one job per tier bundle.
  #
  # WHY --no-default-features IS NON-NEGOTIABLE:
  #   Cargo features are additive. The crate sets
  #   `default = ["tier-2", "webview"]`, so `--features tier-0` means tier-2 plus
  #   the webview front door PLUS tier-0, not tier-0. Measured on this branch:
  #   `cargo tree --features tier-0` still lists `rand` (the dependency that only
  #   the `session` feature pulls in), and `cargo test -p rub3-wrapper --features
  #   tier-0 --lib` runs 62 tests, exactly the default count, instead of tier-0's
  #   32. Without `--no-default-features` this matrix would test the default
  #   bundle every time and look like coverage while proving nothing.
  # ---------------------------------------------------------------------------
  rust:
    name: rust (${{ matrix.bundle }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - bundle: tier-0
            features: tier-0
          - bundle: tier-1
            features: tier-1
          - bundle: tier-2
            features: tier-2
          - bundle: tier-3
            features: tier-3
          - bundle: tier-4
            features: tier-4
          - bundle: tier-3 + headless
            features: tier-3,headless
          # The interactive front door. Tier bundles no longer imply it, so
          # without this entry nothing blocking compiles src/webview.rs.
          - bundle: tier-2 + webview
            features: tier-2,webview

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Show toolchain
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          # Feature sets produce different artifacts; keep a cache per bundle
          # so the matrix jobs do not evict each other.
          key: ${{ matrix.bundle }}

      - name: Build (${{ matrix.bundle }})
        run: cargo build -p rub3-wrapper --no-default-features --features ${{ matrix.features }} --all-targets

      - name: Test (${{ matrix.bundle }})
        run: cargo test -p rub3-wrapper --no-default-features --features ${{ matrix.features }}

  # ---------------------------------------------------------------------------
  # Formatting and lint. NON-BLOCKING on purpose: both fail on main today, so
  # gating on them would block every unrelated PR.
  #
  # Measured on this branch. The fmt drift predates it (main was at 112 hunks
  # across 11 files on fee0124) and the headless files add to it; clippy is
  # unchanged - no warning comes from new or changed code:
  #
  #   cargo fmt --all -- --check                 exit 1, 171 diff hunks across
  #                                              15 files (hand-aligned struct
  #                                              literals and match arms that
  #                                              rustfmt wants to collapse)
  #
  #   cargo clippy --all-targets -- -D warnings  exit 101, 6 warnings, the same
  #                                              6 main already had:
  #                                                too_many_arguments (10/7)
  #                                                map_or can be simplified
  #                                                immediately dereferencing a ref
  #                                                function item cast to integer
  #                                                unread field session_ttl_secs
  #                                                unused fn generate_wallet
  #
  # Cleanup is deliberately deferred to its own task (rub3-fmt-clippy): a
  # whole-repo reformat would conflict with every branch currently open against
  # crates/rub3-wrapper/. When that task lands, delete the `continue-on-error`
  # below and these become real gates.
  #
  # clippy runs with `-D warnings` on purpose: plain `cargo clippy` exits 0 even
  # when it emits warnings, so a permissive clippy job would sit green forever
  # and prove nothing.
  # ---------------------------------------------------------------------------
  lint:
    name: lint (non-blocking, failing on main today)
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: lint

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # always() so a fmt failure does not hide the clippy result.
      - name: cargo clippy
        if: always()
        run: cargo clippy -p rub3-wrapper --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Solidity. `forge test` MUST run from contracts/ -- remappings.txt uses paths
  # relative to that directory, so at the repo root it fails to resolve
  # forge-std/Test.sol. OpenZeppelin and forge-std are git submodules, hence
  # submodules: recursive.
  # ---------------------------------------------------------------------------
  contracts:
    name: contracts (forge test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1.9.1

      - name: forge test
        working-directory: contracts
        run: forge test -vv

  # ---------------------------------------------------------------------------
  # Anvil-gated on-chain E2E, both #[ignore]d suites.
  # session_onchain_e2e.rs spawns a local anvil, deploys Rub3Access with
  # `forge create` from contracts/, runs purchase + activate, then asserts
  # verify_onchain accepts the good session and rejects three tampered ones.
  # headless_e2e.rs drives the agent front door end to end on a fresh key.
  # Both need submodules (forge create compiles the contracts) and Foundry.
  #
  # headless_e2e runs unfiltered and without --test-threads=1: the suite
  # serialises itself in-file around the anvil port and the env vars it sets.
  #
  # Kept in its own job rather than folded into the tier-3 matrix job so that an
  # on-chain failure is distinguishable at a glance from a unit-test failure.
  # ---------------------------------------------------------------------------
  onchain-e2e:
    name: on-chain e2e (tier-3 + anvil)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1.9.1

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: onchain-e2e

      # The test self-skips with a SKIP: message and still exits 0 when anvil,
      # forge or cast are missing. Without this guard a broken Foundry install
      # would turn the whole job into a silent no-op that reports green.
      - name: Require Foundry on PATH
        run: |
          for bin in anvil forge cast; do
            command -v "$bin" >/dev/null 2>&1 || { echo "::error::$bin not found on PATH"; exit 1; }
          done

      - name: session_verify_onchain_e2e
        run: |
          cargo test -p rub3-wrapper --no-default-features --features tier-3 \
            --test session_onchain_e2e -- --ignored --nocapture

      # always() so a failure in the sibling suite does not hide this one.
      - name: headless_e2e
        if: always()
        run: |
          cargo test -p rub3-wrapper --no-default-features --features tier-3,headless \
            --test headless_e2e -- --ignored --nocapture
